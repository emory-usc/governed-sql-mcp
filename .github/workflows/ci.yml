name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Run tests
        run: uv run pytest

      - name: Verify row-level security boundaries
        run: uv run python -m governed_sql_mcp.cli verify

      - name: Build the MCP server in-process
        run: uv run python -c "from governed_sql_mcp.server import create_mcp; m = create_mcp(); assert m.name == 'governed-sql-mcp'; print('MCP server OK')"
